# Plain HTTP only redirects to HTTPS
server {
    listen 8080;
    server_name _;
    # A fixed host name, never the client-supplied Host header (open-redirect risk)
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # The same locally generated certificate the API uses (mounted read-only by Compose)
    ssl_certificate     /etc/nginx/certs/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers are set per location below (nginx does not merge add_header
    # across levels). API responses keep the headers Helmet sets in the API itself.

    # API requests are forwarded to the API container over HTTPS on the internal network
    location /api/ {
        proxy_pass https://api:4000;
        proxy_ssl_verify off;            # internal hop with the self-signed local certificate
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass https://api:4000/health;
        proxy_ssl_verify off;
    }

    # Fingerprinted build assets can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return the React app
    location / {
        # The CSP only allows scripts, styles and requests from this origin, which
        # blocks injected inline scripts (XSS)
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
